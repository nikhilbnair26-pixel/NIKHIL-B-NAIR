<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nikhil b nair</title>
  <link rel="icon" type="image/png" href="./ADD%20A%20HEADINGN.png" />
  <style>
    :root {
      --bg: #09090b;
      --card: #121216;
      --gold: #f5c542;
      --gold-soft: rgba(245, 197, 66, 0.22);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #18150c 0%, var(--bg) 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 18px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 3px solid var(--gold);
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .brand-bar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--gold);
      background: #000000;
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--gold);
      text-transform: lowercase;
    }

    .hero {
      text-align: center;
      padding: 32px 10px 24px;
    }

    .profile-pic {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      background: #18181b;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 2rem;
      color: var(--gold);
      text-transform: lowercase;
      margin-bottom: 10px;
    }

    .handle {
      display: inline-block;
      color: var(--text);
      background: var(--gold-soft);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    .bio {
      color: var(--muted);
      line-height: 1.6;
      max-width: 520px;
      margin: 0 auto 26px;
      font-size: 1rem;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      background: var(--gold);
      color: #09090b;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 10px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="brand-bar">
      <img src="./ADD%20A%20HEADINGN.png" alt="nikhil b nair logo" class="brand-logo" />
      <span class="brand-name">nikhil b nair</span>
    </header>

    <section class="hero">
      <img src="./profile.jpg" alt="nikhil b nair profile picture" class="profile-pic" />
      <h1>nikhil b nair</h1>
      <div class="handle">@nikhilminecraftmalayalam</div>
      <p class="bio">
        Malayalam Minecraft gaming creator. Solo videos, adventure maps, horror mods, and creative storytelling.
      </p>
      <div class="actions">
        <a class="btn" href="https://www.youtube.com/@nikhilminecraftmalayalam" target="_blank" rel="noopener noreferrer">
          Watch on YouTube
        </a>
      </div>
    </section>
  </main>

  <footer>
    nikhil b nair &bull; @nikhilminecraftmalayalam
  </footer>
</body>
</html>
